    <circle cx="1960" cy="760" r="20" fill="#22d3ee" opacity="0.12"/>
    <circle cx="1130" cy="1010" r="9" fill="#2dd4bf" opacity="0.25"/>
    <circle cx="880" cy="470" r="6" fill="#67e8f9" opacity="0.35"/>
    <circle cx="1240" cy="120" r="7" fill="#22d3ee" opacity="0.25"/>
