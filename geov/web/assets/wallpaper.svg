<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="0.68" cy="0.38" r="1.1">
      <stop offset="0" stop-color="#12203f"/>
      <stop offset="0.55" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.75" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.97" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="2048" height="1152" fill="url(#bg)"/>
  <!-- floor grid -->
  <g stroke="#164e63" stroke-width="1.4" opacity="0.5">
    <line x1="0" y1="1000" x2="2048" y2="1000"/>
    <line x1="0" y1="940" x2="2048" y2="940"/>
    <line x1="0" y1="880" x2="2048" y2="880"/>
    <line x1="0" y1="1060" x2="2048" y2="1060"/>
    <line x1="0" y1="1120" x2="2048" y2="1120"/>
    <line x1="240" y1="820" x2="60" y2="1152"/>
    <line x1="640" y1="820" x2="560" y2="1152"/>
    <line x1="1040" y1="820" x2="1060" y2="1152"/>
    <line x1="1440" y1="820" x2="1560" y2="1152"/>
    <line x1="1840" y1="820" x2="2060" y2="1152"/>
  </g>
  <!-- wireframe globe -->
  <g transform="translate(1430,470)">
    <circle r="330" fill="url(#halo)"/>
    <g stroke="url(#wire)" fill="none" stroke-width="2.6">
      <circle r="300"/>
      <ellipse rx="300" ry="118"/>
      <ellipse rx="300" ry="216"/>
      <ellipse rx="118" ry="300"/>
      <ellipse rx="216" ry="300"/>
      <line x1="-300" y1="0" x2="300" y2="0"/>
      <line x1="0" y1="-300" x2="0" y2="300"/>
    </g>
    <g fill="#22d3ee">
      <circle cx="0" cy="-300" r="7"/>
      <circle cx="0" cy="300" r="7"/>
      <circle cx="-300" cy="0" r="7"/>
      <circle cx="300" cy="0" r="7"/>
      <circle cx="0" cy="-118" r="5" opacity="0.8"/>
      <circle cx="0" cy="216" r="5" opacity="0.8"/>
      <circle cx="-216" cy="0" r="5" opacity="0.8"/>
      <circle cx="118" cy="0" r="5" opacity="0.8"/>
    </g>
  </g>
  <!-- bokeh particles -->
  <g>
    <circle cx="180" cy="880" r="26" fill="#22d3ee" opacity="0.14"/>
    <circle cx="330" cy="990" r="14" fill="#2dd4bf" opacity="0.2"/>
    <circle cx="96" cy="640" r="10" fill="#a78bfa" opacity="0.25"/>
    <circle cx="520" cy="720" r="18" fill="#a78bfa" opacity="0.12"/>
    <circle cx="700" cy="200" r="8" fill="#22d3ee" opacity="0.3"/>
